backend:
  name: github
  repo: jacechadwick17/tke-engineering-website
  branch: main
  base_url: https://tke-engineering-website1-1o6r46m7e-jacechadwick17s-projects.vercel.app
  auth_endpoint: oauth

media_folder: "public/uploads"
public_folder: "/uploads"

publish_mode: editorial_workflow

collections:
  - name: "hero"
    label: "Hero Section"
    folder: "public/content/hero"
    create: false
    slug: "hero"
    editor:
      preview: false
    fields:
      - { label: "Background Image", name: "backgroundImage", widget: "image", hint: "Main hero background photo" }
      - { label: "Title Line 1", name: "titleLine1", widget: "string", default: "TKE Engineering", hint: "First line of title (e.g., 'TKE Engineering')" }
      - { label: "Title Line 2", name: "titleLine2", widget: "string", default: "& Design", hint: "Second line of title (e.g., '& Design') - leave blank for no second line" }
      - { label: "Subtitle", name: "subtitle", widget: "text" }
      - { label: "CTA Button 1 Text", name: "cta1Text", widget: "string", default: "Explore Our Services" }
      - { label: "CTA Button 1 Link", name: "cta1Link", widget: "string", default: "#services" }
      - { label: "CTA Button 2 Text", name: "cta2Text", widget: "string", default: "Get In Touch" }
      - { label: "CTA Button 2 Link", name: "cta2Link", widget: "string", default: "#contact" }

  - name: "modelShowcase"
    label: "3D Model Showcase"
    folder: "public/content/model-showcase"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string", default: "3D Conceptual Model" }
      - { label: "Description", name: "description", widget: "string", default: "Initial CAD design and 3D visualization" }
      - { label: "Before Image (3D Model/Planning)", name: "beforeImage", widget: "image", hint: "The 3D model or planning phase image" }
      - { label: "After Image (Completed)", name: "afterImage", widget: "image", hint: "The completed/finished construction image" }
      - { label: "Order", name: "order", widget: "number", default: 1, hint: "Display order (1, 2, 3, etc.)" }

  - name: "jobs"
    label: "Job Openings"
    folder: "public/content/jobs"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Department", name: "department", widget: "select", options: ["Estimating", "Piping", "Electrical", "Civil", "Structural", "Architectural"] }
      - { label: "Active", name: "active", widget: "boolean", default: true, hint: "Uncheck to hide this job posting" }
      - { label: "Description", name: "description", widget: "text" }
      - label: "Requirements"
        name: "requirements"
        widget: "list"
        field: { name: "requirement", label: "Requirement", widget: "string" }

  - name: "projects"
    label: "Projects"
    folder: "public/content/projects"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Company", name: "company", widget: "string" }
      - { label: "Date", name: "date", widget: "string", hint: "e.g., Completed 02/2009" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image" }
      - label: "Materials & Services"
        name: "materials"
        widget: "list"
        field: { name: "material", label: "Material/Service", widget: "string" }

  - name: "services"
    label: "Services"
    folder: "public/content/services"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Icon", name: "icon", widget: "select", options: ["Lightbulb", "FileCheck", "Droplets", "CloudFog", "Settings", "ArrowUpCircle", "ArrowDownCircle", "Wind", "Gauge", "Network", "Wrench"] }
      - { label: "Short Description", name: "shortDescription", widget: "text", required: false }
      - { label: "Full Description", name: "fullDescription", widget: "markdown" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, hint: "Show in main services section" }

  - name: "settings"
    label: "Site Settings"
    files:
      - name: "general"
        label: "General Settings"
        file: "public/content/settings.json"
        fields:
          - { label: "Company Name", name: "companyName", widget: "string" }
          - { label: "Logo Image", name: "logoUrl", widget: "image", required: false, hint: "Upload your logo image (PNG with transparent background recommended). Leave empty to use default TKE logo." }
          - { label: "Logo Width (pixels)", name: "logoWidth", widget: "number", default: 50, hint: "Width of logo in pixels" }
          - { label: "Address Line 1", name: "address1", widget: "string" }
          - { label: "Address Line 2", name: "address2", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Resume Email", name: "resumeEmail", widget: "string" }
          - { label: "Years Experience", name: "yearsExperience", widget: "string", default: "30+" }
          - { label: "Projects Completed", name: "projectsCompleted", widget: "string", default: "500+" }
          - { label: "About Text", name: "aboutText", widget: "markdown" }
          - { label: "What We Do Text", name: "whatWeDoText", widget: "markdown" }
