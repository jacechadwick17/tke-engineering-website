# Decap CMS Configuration
# This uses the GitHub backend for authentication

backend:
  name: github
  repo: jacechadwick17/tke-engineering-website  # <-- CHANGE THIS
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: "public/uploads"
public_folder: "/uploads"

# Enable editorial workflow for draft/preview/publish
publish_mode: editorial_workflow

# Collections define the content types
collections:
  - name: "jobs"
    label: "Job Openings"
    folder: "public/content/jobs"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Job title (e.g., Electrical Design Engineer)" }
      - { label: "Location", name: "location", widget: "string", hint: "City, State (e.g., Houston, TX)" }
      - { label: "Department", name: "department", widget: "select", options: ["Estimating", "Piping", "Electrical", "Civil", "Structural", "Architectural"], default: "Electrical" }
      - { label: "Active", name: "active", widget: "boolean", default: true, hint: "Uncheck to hide this job posting" }
      - { label: "Description", name: "description", widget: "text", hint: "Brief job description" }
      - label: "Requirements"
        name: "requirements"
        widget: "list"
        field: { name: "requirement", label: "Requirement", widget: "string" }
        hint: "List of job requirements"

  - name: "projects"
    label: "Projects"
    folder: "public/content/projects"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Name", name: "name", widget: "string", hint: "Project name (e.g., Wyckoff)" }
      - { label: "Company", name: "company", widget: "string", hint: "Client company name" }
      - { label: "Date", name: "date", widget: "string", hint: "Completion date (e.g., Completed 02/2009)" }
      - { label: "Location", name: "location", widget: "string", hint: "Project location" }
      - { label: "Description", name: "description", widget: "text", hint: "Project description" }
      - { label: "Image", name: "image", widget: "image", hint: "Project photo URL or upload" }
      - label: "Materials & Services"
        name: "materials"
        widget: "list"
        field: { name: "material", label: "Material/Service", widget: "string" }
        hint: "List of materials and services provided"

  - name: "services"
    label: "Services"
    folder: "public/content/services"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Name", name: "name", widget: "string", hint: "Service name" }
      - { label: "Icon", name: "icon", widget: "select", options: ["Lightbulb", "FileCheck", "Droplets", "CloudFog", "Settings", "ArrowUpCircle", "ArrowDownCircle", "Wind", "Gauge", "Network", "Wrench"], default: "Settings" }
      - { label: "Short Description", name: "shortDescription", widget: "text", required: false, hint: "Brief description for listings" }
      - { label: "Full Description", name: "fullDescription", widget: "markdown", hint: "Full detailed description" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, hint: "Show in main services section" }

  - name: "settings"
    label: "Site Settings"
    files:
      - name: "general"
        label: "General Settings"
        file: "public/content/settings.json"
        fields:
          - { label: "Company Name", name: "companyName", widget: "string" }
          - { label: "Address Line 1", name: "address1", widget: "string" }
          - { label: "Address Line 2", name: "address2", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Resume Email", name: "resumeEmail", widget: "string", hint: "Email for job applications" }
          - { label: "About Text", name: "aboutText", widget: "markdown" }
          - { label: "What We Do Text", name: "whatWeDoText", widget: "markdown" }
