backend:
  name: git-gateway
  branch: main
media_folder: "public/uploads"
public_folder: "/uploads"
publish_mode: editorial_workflow
collections:
  - name: "hero"
    label: "Hero Section"
    folder: "public/content/hero"
    create: false
    slug: "hero"
    editor: { preview: false }
    fields:
      - { label: "Background Video", name: "backgroundVideo", widget: "file", required: false }
      - { label: "Background Fallback Image", name: "backgroundImage", widget: "image", required: false }
      - { label: "Title Line 1", name: "titleLine1", widget: "string" }
      - { label: "Title Line 2", name: "titleLine2", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "text" }
      - { label: "CTA Button 1 Text", name: "cta1Text", widget: "string" }
      - { label: "CTA Button 1 Link", name: "cta1Link", widget: "string" }
      - { label: "CTA Button 2 Text", name: "cta2Text", widget: "string" }
      - { label: "CTA Button 2 Link", name: "cta2Link", widget: "string" }
  - name: "modelShowcase"
    label: "3D Model Showcase"
    folder: "public/content/model-showcase"
    create: true
    slug: "{{slug}}"
    editor: { preview: false }
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Before Image", name: "beforeImage", widget: "image" }
      - { label: "After Image", name: "afterImage", widget: "image" }
      - { label: "Order", name: "order", widget: "number" }
  - name: "jobs"
    label: "Job Openings"
    folder: "public/content/jobs"
    create: true
    slug: "{{slug}}"
    editor: { preview: false }
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Department", name: "department", widget: "select", options: ["Estimating", "Mechanical", "Electrical", "Civil", "Structural", "Architectural"] }
      - { label: "Active", name: "active", widget: "boolean" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Requirements", name: "requirements", widget: "list", field: { label: "Requirement", name: "requirement", widget: "string" } }
  - name: "projects"
    label: "Projects"
    folder: "public/content/projects"
    create: true
    slug: "{{slug}}"
    editor: { preview: false }
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Company", name: "company", widget: "string" }
      - { label: "Date", name: "date", widget: "string" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Images", name: "images", widget: "list", field: { label: "Image", name: "image", widget: "image" } }
      - { label: "Materials & Services", name: "materials", widget: "list", field: { label: "Material/Service", name: "material", widget: "string" } }
  - name: "services"
    label: "Services"
    folder: "public/content/services"
    create: true
    slug: "{{slug}}"
    editor: { preview: false }
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Icon", name: "icon", widget: "select", options: ["Lightbulb", "FileCheck", "Droplets", "CloudFog", "Settings", "ArrowUpCircle", "ArrowDownCircle", "Wind", "Gauge", "Network", "Wrench"] }
      - { label: "Short Description", name: "shortDescription", widget: "text", required: false }
      - { label: "Full Description", name: "fullDescription", widget: "markdown" }
      - { label: "Featured", name: "featured", widget: "boolean" }
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "general"
        label: "General Settings"
        file: "public/content/settings.json"
        fields:
          - { label: "Company Name", name: "companyName", widget: "string" }
          - { label: "Logo Image", name: "logoUrl", widget: "image", required: false }
          - { label: "Logo Width (pixels)", name: "logoWidth", widget: "number" }
          - { label: "Address Line 1", name: "address1", widget: "string" }
          - { label: "Address Line 2", name: "address2", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Resume Email", name: "resumeEmail", widget: "string" }
          - { label: "Years Experience", name: "yearsExperience", widget: "string" }
          - { label: "Projects Completed", name: "projectsCompleted", widget: "string" }
          - { label: "About Text", name: "aboutText", widget: "markdown" }
          - { label: "What We Do Text", name: "whatWeDoText", widget: "markdown" }
  - name: "projectsManifest"
    label: "Projects List (Auto-managed)"
    folder: "public/content"
    create: false
    slug: "projects-manifest"
    editor: { preview: false }
    fields:
      - { label: "Project Order", name: "projects", widget: "list", field: { label: "Project Slug", name: "slug", widget: "string" } }
  - name: "modelShowcaseManifest"
    label: "3D Slides List (Auto-managed)"
    folder: "public/content"
    create: false
    slug: "model-showcase-manifest"
    editor: { preview: false }
    fields:
      - { label: "Slide Order", name: "slides", widget: "list", field: { label: "Slide Slug", name: "slug", widget: "string" } }
  - name: "hrDocs"
    label: "HR Documents"
    folder: "public/content/hr-docs"
    create: true
    slug: "{{slug}}"
    editor: { preview: false }
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Benefits", "Time Off", "Finance", "General", "Onboarding"] }
      - { label: "Document File (PDF)", name: "documentFile", widget: "file" }
